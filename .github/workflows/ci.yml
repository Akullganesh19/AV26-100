name: EpiSense CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: episense
          POSTGRES_PASSWORD: episense
          POSTGRES_DB: episense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-asyncio httpx psycopg2-binary

    - name: Set up Test Database
      env:
        PGPASSWORD: episense
      run: |
        psql -h localhost -U episense -d postgres -c "CREATE DATABASE episense_test_test;"

    - name: Run Gitleaks Secret Scan
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run Linting
      run: |
        pip install flake8
        flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Tests
      env:
        DATABASE_URL: postgresql+asyncpg://episense:episense@localhost:5432/episense_test
        SECRET_KEY: test_secret_key_for_ci
        REDIS_HOST: localhost
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
        pytest backend/tests/ml/test_features.py
